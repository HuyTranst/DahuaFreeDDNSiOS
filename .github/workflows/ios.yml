name: Build Dahua Free DDNS iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || true
          xcodebuild -version

      - name: Find Project & Build iOS App
        run: |
          PROJ_PATH=$(find . -name "DahuaFreeDDNSiOS.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: DahuaFreeDDNSiOS.xcodeproj not found!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Found project directory at: $PROJ_DIR"
          cd "$PROJ_DIR"

          # Ensure swift files exist in current directory and DahuaFreeDDNSiOS subfolder
          mkdir -p DahuaFreeDDNSiOS
          for file in DahuaFreeDDNSApp.swift ContentView.swift DahuaCgiClient.swift; do
            FOUND_FILE=$(find . -name "$file" -type f | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              cp "$FOUND_FILE" .
              cp "$FOUND_FILE" DahuaFreeDDNSiOS/
            fi
          done

          echo "=== Directory contents before build ==="
          ls -la
          ls -la DahuaFreeDDNSiOS || true

          # Run xcodebuild and capture full log if error occurs
          set +e
          xcodebuild -project DahuaFreeDDNSiOS.xcodeproj \
                     -target DahuaFreeDDNSiOS \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES > xcodebuild.log 2>&1
          
          BUILD_STATUS=$?
          cat xcodebuild.log

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "xcodebuild failed with exit code $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Copying app from: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r DahuaFreeDDNS-Real.ipa Payload

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahuaFreeDDNS-Real-IPA
          path: "**/DahuaFreeDDNS-Real.ipa"
