name: Build Dahua Free DDNS iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Swift directly to iOS ARM64 Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK at: $SDK_PATH"

          echo "=== Compiling with Swiftc (Release Mode) ==="
          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -parse-as-library \
                 -O \
                 -framework Foundation \
                 -framework SwiftUI \
                 -framework UIKit \
                 -framework AVFoundation \
                 -framework CoreImage \
                 -framework Network \
                 -framework CryptoKit \
                 DahuaFreeDDNSiOS/*.swift \
                 -o DahuaFreeDDNS 2>&1 | tee compile.log

          echo "### Swift Compilation Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat compile.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ ! -f DahuaFreeDDNS ]; then
            echo "Binary was not created. Stopping."
            exit 1
          fi

          echo "=== Packaging IPA Bundle ==="
          mkdir -p Payload/DahuaFreeDDNS.app
          mv DahuaFreeDDNS Payload/DahuaFreeDDNS.app/

          PLIST_FILE=$(find . -name "Info.plist" -type f | head -n 1)
          if [ -n "$PLIST_FILE" ]; then
            cp "$PLIST_FILE" Payload/DahuaFreeDDNS.app/Info.plist
          else
            echo "" | base64 --decode > Payload/DahuaFreeDDNS.app/Info.plist
          fi

          echo "APPL????" > Payload/DahuaFreeDDNS.app/PkgInfo
          if [ -f "logo.png" ]; then
            cp logo.png Payload/DahuaFreeDDNS.app/logo.png
            cp logo.png Payload/DahuaFreeDDNS.app/AppIcon60x60@2x.png
            cp logo.png Payload/DahuaFreeDDNS.app/AppIcon60x60@3x.png
            cp logo.png Payload/DahuaFreeDDNS.app/AppIcon76x76@2x.png
            cp logo.png Payload/DahuaFreeDDNS.app/AppIcon.png
          fi
          for icon in AppIcon.png AppIcon60x60@2x.png AppIcon60x60@3x.png AppIcon76x76@2x.png; do
            if [ -f "$icon" ]; then
              cp "$icon" Payload/DahuaFreeDDNS.app/
            elif [ -f "DahuaFreeDDNSiOS/$icon" ]; then
              cp "DahuaFreeDDNSiOS/$icon" Payload/DahuaFreeDDNS.app/
            fi
          done
          if [ -f "camera_logo.png" ]; then
            cp camera_logo.png Payload/DahuaFreeDDNS.app/
          fi

          echo "=== Ad-Hoc / Release Codesign for TrollStore (No Developer Mode) ==="
          if [ -f "entitlements.plist" ]; then
            cp entitlements.plist Payload/DahuaFreeDDNS.app/entitlements.plist
            codesign -s - -f --entitlements entitlements.plist Payload/DahuaFreeDDNS.app/DahuaFreeDDNS || true
            codesign -s - -f --entitlements entitlements.plist Payload/DahuaFreeDDNS.app || true
          fi
          if command -v ldid &> /dev/null; then
            ldid -Sentitlements.plist Payload/DahuaFreeDDNS.app/DahuaFreeDDNS || true
          fi

          zip -r DahuaFreeDDNS-Real.ipa Payload

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahuaFreeDDNS-Real-IPA
          path: DahuaFreeDDNS-Real.ipa

      - name: Create or Update GitHub Release for High-Speed Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Dahua & Imou Manager iOS v1.0.0"
          body: |
            📱 **Bản IPA cài đặt chính thức cho iPhone / iPad (Tốc độ tải cực nhanh từ GitHub Release)**
            
            - ⚙️ **Giao diện Menu 5 mục bên dưới (Trang chủ, Sản phẩm, Quét LAN, Dễ Cấu Hình, Tôi)**
            - 🔍 **Check bảo hành S/N, Check Port, Super Password, Set Date/NTP, Reboot Camera**
            - 🖼️ **Logo PNG nhúng sắc nét nguyên bản 100%**
            - 🚀 **Tải trực tiếp file `DahuaFreeDDNS-Real.ipa` bên dưới để cài đặt nhanh chóng!**
          files: DahuaFreeDDNS-Real.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
