name: Build Dahua Free DDNS iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Find Project & Prepare Sources
        run: |
          PROJ_PATH=$(find . -name "DahuaFreeDDNSiOS.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: DahuaFreeDDNSiOS.xcodeproj not found!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Found project directory at: $PROJ_DIR"
          cd "$PROJ_DIR"

          # Ensure swift files exist in build directory
          mkdir -p DahuaFreeDDNSiOS
          for file in DahuaFreeDDNSApp.swift ContentView.swift DahuaCgiClient.swift; do
            FOUND_FILE=$(find . -name "$file" -type f | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              cp "$FOUND_FILE" .
              cp "$FOUND_FILE" DahuaFreeDDNSiOS/
            fi
          done

          # Run xcodebuild with Auto-generated Info.plist
          xcodebuild -project DahuaFreeDDNSiOS.xcodeproj \
                     -target DahuaFreeDDNSiOS \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Copying app from: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r DahuaFreeDDNS-Real.ipa Payload

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahuaFreeDDNS-Real-IPA
          path: "**/DahuaFreeDDNS-Real.ipa"
