name: Build Dahua Free DDNS iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Find Project and Build iOS App
        run: |
          PROJ_PATH=$(find . -name "DahuaFreeDDNSiOS.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: DahuaFreeDDNSiOS.xcodeproj not found!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Found project directory at: $PROJ_DIR"
          cd "$PROJ_DIR"

          xcodebuild -project DahuaFreeDDNSiOS.xcodeproj \
                     -target DahuaFreeDDNSiOS \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO

          mkdir -p Payload
          APP_PATH=$(find build -name "DahuaFreeDDNS.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Copying app from: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r DahuaFreeDDNS-Real.ipa Payload

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahuaFreeDDNS-Real-IPA
          path: "**/DahuaFreeDDNS-Real.ipa"
