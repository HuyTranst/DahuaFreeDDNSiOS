name: Build Dahua Free DDNS iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Swift directly to iOS ARM64 Binary
        run: |
          echo "=== Locating Swift Files ==="
          SWIFT_FILES=$(find . -name "*.swift" -type f | tr '\n' ' ')
          echo "Found Swift files: $SWIFT_FILES"

          if [ -z "$SWIFT_FILES" ]; then
            echo "Error: No Swift files found!"
            exit 1
          fi

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK at: $SDK_PATH"

          echo "=== Compiling with Swiftc ==="
          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -parse-as-library \
                 $SWIFT_FILES \
                 -o DahuaFreeDDNS

          echo "=== Packaging IPA Bundle ==="
          mkdir -p Payload/DahuaFreeDDNS.app

          mv DahuaFreeDDNS Payload/DahuaFreeDDNS.app/

          # Copy Info.plist if available, or generate a valid Info.plist
          PLIST_FILE=$(find . -name "Info.plist" -type f | head -n 1)
          if [ -n "$PLIST_FILE" ]; then
            cp "$PLIST_FILE" Payload/DahuaFreeDDNS.app/Info.plist
          else
            cat << 'EOF' > Payload/DahuaFreeDDNS.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>CFBundleDevelopmentRegion</key>
	<string>en</string>
	<key>CFBundleExecutable</key>
	<string>DahuaFreeDDNS</string>
	<key>CFBundleIdentifier</key>
	<string>com.dahua.freeddns.ios</string>
	<key>CFBundleInfoDictionaryVersion</key>
	<string>6.0</string>
	<key>CFBundleName</key>
	<string>DahuaFreeDDNS</string>
	<key>CFBundlePackageType</key>
	<string>APPL</string>
	<key>CFBundleShortVersionString</key>
	<string>1.0</string>
	<key>CFBundleVersion</key>
	<string>1</string>
	<key>LSRequiresIPhoneOS</key>
	<true/>
	<key>NSAppTransportSecurity</key>
	<dict>
		<key>NSAllowsArbitraryLoads</key>
		<true/>
	</dict>
</dict>
</plist>
EOF
          fi

          echo "APPL????" > Payload/DahuaFreeDDNS.app/PkgInfo
          zip -r DahuaFreeDDNS-Real.ipa Payload

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahuaFreeDDNS-Real-IPA
          path: DahuaFreeDDNS-Real.ipa
